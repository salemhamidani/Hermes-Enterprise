<?xml version="1.0" encoding="UTF-8"?>
<!-- Hermes Enterprise Stack (HES) -->
<!-- File: docs/assets/network-topology.svg -->
<!-- Purpose: Network segmentation diagram. Dark-theme compatible. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Hermes Enterprise Stack — Network Topology</title>
  <desc>Network segmentation: public ingress zone, internal-only zone, Docker API access via socket proxy, and future service attachment.</desc>

  <rect width="1120" height="560" fill="#0d1117"/>

  <text x="560" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">Hermes Enterprise Stack — Network Topology</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Internet -->
  <rect x="40" y="220" width="150" height="60" rx="30" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#93c5fd">Internet</text>
  <text x="115" y="266" text-anchor="middle" font-size="11" fill="#60a5fa">Clients</text>

  <line x1="190" y1="250" x2="232" y2="250" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="211" y="242" text-anchor="middle" font-size="9" fill="#8b949e">HTTP/HTTPS</text>

  <!-- ===== Public Ingress Zone ===== -->
  <rect x="234" y="100" width="360" height="340" rx="12" fill="#161b22" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="252" y="124" font-size="12" font-weight="700" fill="#06b6d4" letter-spacing="1.5">PUBLIC INGRESS ZONE</text>

  <rect x="270" y="200" width="260" height="80" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#6ee7b7">Traefik v3</text>
  <text x="400" y="248" text-anchor="middle" font-size="11" fill="#a7f3d0">port 80 · port 443</text>
  <text x="400" y="266" text-anchor="middle" font-size="11" fill="#a7f3d0">TLS · redirect to HTTPS</text>

  <rect x="270" y="310" width="260" height="70" rx="8" fill="#083344" stroke="#06b6d4"/>
  <text x="400" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#67e8f9">hes-public</text>
  <text x="400" y="354" text-anchor="middle" font-size="10" fill="#a5f3fc">bridge · attachable</text>
  <text x="400" y="370" text-anchor="middle" font-size="10" fill="#a5f3fc">NOT internal</text>

  <!-- Traefik on public network -->
  <line x1="400" y1="280" x2="400" y2="308" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="410" y="298" font-size="9" fill="#67e8f9">attached</text>

  <!-- ===== Internal-Only Zone ===== -->
  <rect x="640" y="100" width="360" height="340" rx="12" fill="#161b22" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="658" y="124" font-size="12" font-weight="700" fill="#ef4444" letter-spacing="1.5">INTERNAL-ONLY ZONE</text>

  <rect x="676" y="150" width="290" height="80" rx="10" fill="#4c0519" stroke="#ef4444" stroke-width="1.5"/>
  <text x="821" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#fca5a5">Docker Socket Proxy</text>
  <text x="821" y="198" text-anchor="middle" font-size="11" fill="#fecaca">tecnativa/docker-socket-proxy</text>
  <text x="821" y="216" text-anchor="middle" font-size="11" fill="#fecaca">reduced permissions</text>

  <rect x="676" y="310" width="290" height="70" rx="8" fill="#3b1d1d" stroke="#ef4444"/>
  <text x="821" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#fca5a5">hes-internal</text>
  <text x="821" y="354" text-anchor="middle" font-size="10" fill="#fecaca">bridge · internal:true</text>
  <text x="821" y="370" text-anchor="middle" font-size="10" fill="#fecaca">NOT attachable</text>

  <!-- Socket proxy on internal network -->
  <line x1="821" y1="230" x2="821" y2="308" stroke="#ef4444" stroke-width="1.5"/>
  <text x="831" y="276" font-size="9" fill="#fca5a5">attached</text>

  <!-- Docker API -->
  <rect x="700" y="420" width="240" height="50" rx="8" fill="#3b1d1d" stroke="#ef4444" stroke-dasharray="5 3"/>
  <text x="820" y="440" text-anchor="middle" font-size="12" font-weight="600" fill="#fca5a5">Docker API</text>
  <text x="820" y="458" text-anchor="middle" font-size="10" fill="#fecaca">read-only metadata</text>
  <line x1="821" y1="380" x2="820" y2="418" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="830" y="402" font-size="9" fill="#fca5a5">read-only</text>

  <!-- ===== Cross-zone connections ===== -->
  <!-- Traefik -> internal (discovery via proxy) -->
  <path d="M 530 240 Q 600 180 676 190" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrCyan)"/>
  <text x="608" y="176" text-anchor="middle" font-size="10" fill="#67e8f9">discovery via proxy</text>

  <!-- Docker API -> Traefik (metadata, curved back) -->
  <path d="M 700 440 Q 480 470 400 282" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrCyan)"/>
  <text x="500" y="466" text-anchor="middle" font-size="10" fill="#67e8f9">metadata for routing</text>

  <!-- ===== Future Services ===== -->
  <rect x="60" y="470" width="120" height="44" rx="8" fill="#2d333b" stroke="#6b7280" stroke-dasharray="4 3"/>
  <text x="120" y="490" text-anchor="middle" font-size="11" font-weight="600" fill="#d1d5db">Future</text>
  <text x="120" y="506" text-anchor="middle" font-size="9" fill="#9ca3af">public service</text>
  <line x1="150" y1="470" x2="380" y2="312" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="250" y="452" font-size="9" fill="#9ca3af">attach to public</text>

  <rect x="960" y="470" width="120" height="44" rx="8" fill="#2d333b" stroke="#6b7280" stroke-dasharray="4 3"/>
  <text x="1020" y="490" text-anchor="middle" font-size="11" font-weight="600" fill="#d1d5db">Future</text>
  <text x="1020" y="506" text-anchor="middle" font-size="9" fill="#9ca3af">internal service</text>
  <line x1="1000" y1="470" x2="880" y2="382" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="945" y="452" font-size="9" fill="#9ca3af">east-west traffic</text>

  <!-- Legend -->
  <rect x="234" y="460" width="360" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="252" y="478" font-size="9" fill="#8b949e">&#9632; green = ingress</text>
  <text x="252" y="494" font-size="9" fill="#8b949e">&#9632; cyan = public net</text>
  <text x="370" y="478" font-size="9" fill="#8b949e">&#9632; red = security</text>
  <text x="370" y="494" font-size="9" fill="#8b949e">dashed = future / indirect</text>
</svg>
