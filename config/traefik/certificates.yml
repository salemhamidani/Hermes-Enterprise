# Hermes Enterprise Stack (HES)
# File: config/traefik/certificates.yml
# Purpose: Document certificate resolver policy without adding static secrets.

certificatesResolvers:
  letsencrypt:
    acme:
      email: "configured-by-HES_ADMIN_EMAIL"
      storage: "configured-by-HES_TRAEFIK_ACME_STORAGE"
      caServer: "configured-by-HES_TRAEFIK_ACME_CA_SERVER"
      httpChallenge:
        entryPoint: web

  letsencrypt-staging:
    acme:
      email: "configured-by-HES_ADMIN_EMAIL"
      storage: "configured-by-HES_TRAEFIK_ACME_STORAGE"
      caServer: "configured-by-HES_TRAEFIK_ACME_STAGING_CA_SERVER"
      httpChallenge:
        entryPoint: web
