# Hermes Enterprise Stack (HES)
# File: config/traefik/traefik.yml
# Purpose: Reference production Traefik static configuration for Sprint 2.

# The active Compose service passes these settings as CLI flags so operators do
# not need to change startup behavior. This file mirrors the intended static
# configuration for future migration to --configFile=/etc/traefik/traefik.yml.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: false

ping:
  entryPoint: traefik

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  traefik:
    address: ":8080"
  metrics:
    address: ":9100"

providers:
  docker:
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
  file:
    filename: "/etc/traefik/dynamic.yml"
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "admin@example.com"
      storage: "/letsencrypt/acme.json"
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      httpChallenge:
        entryPoint: web

log:
  level: INFO
  format: json
  filePath: "/var/log/traefik/application/traefik.log"

accessLog:
  format: json
  filePath: "/var/log/traefik/access/access.log"

metrics:
  prometheus:
    entryPoint: metrics
