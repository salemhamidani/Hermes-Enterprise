# Hermes Enterprise Stack (HES)
# File: config/traefik/traefik.yml
# Purpose: Placeholder for Traefik static configuration.
#
# This file is NOT loaded by the running Traefik container in Phase 1. Phase 1
# configures Traefik entirely via CLI flags in compose/traefik.yml. This
# placeholder documents where future static configuration will live once the
# project migrates from CLI flags to a static config file.
#
# When enabling, mount this file into the container and start Traefik with
# --configFile=/etc/traefik/traefik.yml. Everything below is commented out so
# that no entrypoint, provider, or certificate resolver is enabled by default.

