# Hermes Enterprise Stack (HES)
# File: config/traefik/middlewares.yml
# Purpose: Reference reusable Traefik middleware for future services.

http:
  middlewares:
    hes-rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s

    hes-compress:
      compress:
        encodings:
          - gzip
          - br
        excludedContentTypes:
          - text/event-stream
        minResponseBodyBytes: 1024

    hes-secure-chain:
      chain:
        middlewares:
          - hes-security-headers
          - hes-rate-limit
          - hes-compress
