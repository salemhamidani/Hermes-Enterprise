# Hermes Enterprise Stack (HES)
# File: config/providers/nous-hermes.yml
# Purpose: Provider metadata for the official Nous Hermes Agent provider.

provider:
  provider_id: nous-hermes
  display_name: Nous Hermes Agent
  provider_type: official
  runtime_mode: container-image
  status: supported-reference
  default_registry: docker.io
  default_image: nousresearch/hermes-agent
  default_version: v2026.7.7.2
  documentation: https://hermes-agent.nousresearch.com/docs
  repository: https://github.com/NousResearch/hermes-agent
  notes:
    - Official provider discovered during Sprint 2.5.
    - This metadata does not create a container or pull an image.
    - HES must still route implementation through the provider layer.
