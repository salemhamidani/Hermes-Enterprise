# Hermes Enterprise Stack (HES)
# File: .github/workflows/yamllint.yml
# Purpose: Lint YAML files for style and formatting consistency.

name: YAML Lint

"on":
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/yamllint.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.yml"
      - "**/*.yaml"

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint \
            -d "{extends: default, rules: {line-length: {max: 200}, document-start: disable, new-line-at-end-of-file: enable}}" \
            compose/ \
            config/ \
            .github/workflows/
