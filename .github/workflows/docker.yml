# Hermes Enterprise Stack (HES)
# File: .github/workflows/docker.yml
# Purpose: Validate Docker Compose configuration and build readiness.

name: Docker

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "compose/**"
      - ".env.example"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "compose/**"

jobs:
  compose-config:
    name: Compose Config Validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare env
        run: cp .env.example .env

      - name: Compose config
        run: |
          docker compose \
            --project-directory . \
            --env-file .env \
            -f compose/compose.yml \
            config

      - name: Check no deprecated version key
        run: |
          if find compose/ -type f -name '*.yml' -exec grep -H "^version:" {} +; then
            echo "::error::Deprecated Compose version keys are not allowed"
            exit 1
          fi

      - name: Check no container_name
        run: |
          if find compose/ -type f -name '*.yml' -exec grep -H "container_name:" {} +; then
            echo "::error::Fixed container_name values are not allowed"
            exit 1
          fi

      - name: Check no latest tag
        run: |
          if find compose/ -type f -name '*.yml' -exec grep -H "image: .*:latest" {} +; then
            echo "::error::Floating latest image tags are not allowed"
            exit 1
          fi

      - name: Check healthchecks present
        run: |
          for file in compose/security.yml compose/traefik.yml; do
            if ! grep -q "healthcheck:" "$file"; then
              echo "::error::Missing healthcheck in $file"
              exit 1
            fi
          done

      - name: Check log rotation present
        run: |
          for file in compose/security.yml compose/traefik.yml; do
            if ! grep -q "max-size" "$file"; then
              echo "::error::Missing log rotation in $file"
              exit 1
            fi
          done