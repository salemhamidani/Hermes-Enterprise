# Hermes Enterprise Stack (HES)
# File: .github/workflows/lint.yml
# Purpose: Lint Markdown documentation and YAML files for formatting and style.

name: Lint

"on":
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        run: |
          markdownlint \
            --config .github/markdownlint.json \
            --ignore node_modules \
            --ignore docs/Phase1.html \
            "**/*.md"

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint \
            -c .yamllint.yml \
            .yamllint.yml \
            .github/dependabot.yml \
            compose/ \
            config/ \
            .github/workflows/
