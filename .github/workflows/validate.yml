# Hermes Enterprise Stack (HES)
# File: .github/workflows/validate.yml
# Purpose: Validate scripts, configuration, and Docker Compose files.

name: Validate

"on":
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate HES
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/lib/*.sh scripts/install/*.sh

      - name: Validate
        run: make validate
