# Hermes Enterprise Stack (HES)
# File: .github/workflows/validate.yml
# Purpose: Validate Phase 1 scripts and Compose configuration in GitHub Actions.

name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate HES
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Prepare env
        run: cp .env.example .env

      - name: Validate
        run: make validate
