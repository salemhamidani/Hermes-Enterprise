# Hermes Enterprise Stack (HES)
# File: compose/traefik.yml
# Purpose: Define production Traefik ingress infrastructure for Sprint 2 security foundation.

name: ${HES_COMPOSE_PROJECT_NAME:-hes}

services:
  traefik:
    image: ${HES_TRAEFIK_IMAGE:-traefik:v3.3}
    restart: ${HES_RESTART_POLICY:-unless-stopped}
    read_only: true
    init: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --api.dashboard=false
      - --ping=true
      - --ping.entrypoint=${HES_TRAEFIK_PING_ENTRYPOINT:-traefik}
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=${HES_TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - --entrypoints.traefik.address=:8080
      - --entrypoints.metrics.address=:9100
      - --providers.docker=true
      - --providers.docker.endpoint=${HES_TRAEFIK_DOCKER_ENDPOINT:-tcp://docker-socket-proxy:2375}
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --certificatesresolvers.${HES_TRAEFIK_CERT_RESOLVER:-letsencrypt}.acme.email=${HES_ADMIN_EMAIL:-admin@example.com}
      - --certificatesresolvers.${HES_TRAEFIK_CERT_RESOLVER:-letsencrypt}.acme.storage=${HES_TRAEFIK_ACME_STORAGE:-/letsencrypt/acme.json}
      - --certificatesresolvers.${HES_TRAEFIK_CERT_RESOLVER:-letsencrypt}.acme.caserver=${HES_TRAEFIK_ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.${HES_TRAEFIK_CERT_RESOLVER:-letsencrypt}.acme.httpchallenge=true
      - --certificatesresolvers.${HES_TRAEFIK_CERT_RESOLVER:-letsencrypt}.acme.httpchallenge.entrypoint=web
      - --log.level=${HES_TRAEFIK_LOG_LEVEL:-INFO}
      - --log.format=${HES_TRAEFIK_LOG_FORMAT:-json}
      - --log.filepath=${HES_TRAEFIK_APP_LOG_FILE:-/var/log/traefik/application/traefik.log}
      - --accesslog=${HES_TRAEFIK_ACCESS_LOG_ENABLED:-true}
      - --accesslog.format=json
      - --accesslog.filepath=${HES_TRAEFIK_ACCESS_LOG_FILE:-/var/log/traefik/access/access.log}
      - --metrics.prometheus=${HES_TRAEFIK_METRICS_ENABLED:-true}
      - --metrics.prometheus.entrypoint=${HES_TRAEFIK_METRICS_ENTRYPOINT:-metrics}
    ports:
      - target: 80
        published: ${HES_TRAEFIK_HTTP_PORT:-80}
        protocol: tcp
      - target: 443
        published: ${HES_TRAEFIK_HTTPS_PORT:-443}
        protocol: tcp
    volumes:
      - ${HES_CONFIG_DIR:-./config}/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ${HES_SSL_DIR:-./ssl}/letsencrypt:/letsencrypt
      - ${HES_LOG_DIR:-./logs}/traefik:/var/log/traefik
    networks:
      - hes-frontend
      - hes-management
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "${HES_DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${HES_DOCKER_LOG_MAX_FILE:-5}"
    labels:
      traefik.enable: "false"
      com.hermes.stack: "${HES_PROJECT_NAME:-hermes-enterprise}"
      com.hermes.environment: "${HES_ENVIRONMENT:-production}"
      com.hermes.phase: "1"
      org.opencontainers.image.title: "Hermes Enterprise Stack Traefik"
      org.opencontainers.image.description: "Production ingress reverse proxy for HES security foundation."
